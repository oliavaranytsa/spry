name: Deploy backend

# On every push to main: lint and test the backend, then build the image, push
# it to ECR tagged with the commit SHA, and roll the Lambda function to it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: an interrupted
# CloudFormation update is worse than a queued one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  lint:
    name: Lint backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spry
          POSTGRES_PASSWORD: spry
          POSTGRES_DB: spry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://spry:spry@localhost:5432/spry_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    name: Lambda
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      # Required to fetch the OIDC token that AWS trades for the role. The job
      # holds no long-lived credentials.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-backend-${{ github.run_id }}

      # The function runs on arm64 and this runner is x86, so the image is
      # built under emulation (slower, but it works).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        run: make deploy-backend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}

      - name: Summary
        if: always()
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME:-peach}-backend" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "unknown")
          {
            echo "### Backend deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA::12}\` |"
            echo "| api | ${API_URL} |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
