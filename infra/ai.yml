AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry agenda parser (Lab 6): a Lambda function behind its own function URL
  that turns pasted text into a meeting agenda with Claude on Amazon Bedrock.
  It runs outside the VPC - it needs no database - and reaches Bedrock and
  Cognito's public keys over the internet, with no NAT and no VPC endpoint.
  It only reads and answers; saving goes through the main API. Also the
  monthly budget alarm. Deployed by scripts/deploy-ai.sh.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for every resource name, and the project tag.

  ImageUri:
    Type: String
    Description: The backend image (the deploy script reads it off the API function).

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    AllowedValues:
      - anthropic.claude-opus-5-5
      - anthropic.claude-sonnet-5-5
      - anthropic.claude-haiku-5-5

  ParserRegion:
    Type: String
    Default: us-east-1
    Description: Where Bedrock is called, whatever region this stack is in.

  CognitoRegion:
    Type: String
    Default: us-east-1

  CognitoUserPoolId:
    Type: String
    Description: From make deploy-cognito. The handler accepts only this pool's access tokens.

  CognitoClientId:
    Type: String

  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Browser origins allowed to call the parser, e.g. the CloudFront site and localhost.

  LogRetentionDays:
    Type: Number
    Default: 14

  BudgetEmail:
    Type: String
    Default: ""
    Description: Where the budget alarm goes. Empty skips the budget.

  BudgetLimitUsd:
    Type: Number
    Default: 5

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      # Logs only: no VPC access, no database, no S3. Plus one Bedrock action.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # "*" for now; narrowing it is a discussion question of the lab.
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Parser:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Pasted text in, agenda JSON out (Claude on Bedrock). Never writes.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      # Same image as the API, another entry point.
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ParserRole.Arn
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      # No VpcConfig on purpose: outside the VPC the function reaches Bedrock
      # and Cognito directly, at no cost while nobody uses it.
      Environment:
        Variables:
          APP_ENV: production
          PARSER_MODEL: !Ref ParserModel
          PARSER_REGION: !Ref ParserRegion
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Public URL, but the handler verifies the Cognito token on every call: an
  # open LLM endpoint is a wallet without a lock. CORS here, for the site's
  # origins and POST only; the browser's preflight never reaches the code.
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Parser
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  # A public function URL needs both grants, as for the API in Lab 4.
  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # The cheapest insurance in the course: an email when the month's bill
  # passes the limit, and another when it is forecast to.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ParserUrl:
    Description: POST here with a Cognito access token. No trailing slash.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt ParserUrl.FunctionUrl]]

  FunctionName:
    Value: !Ref Parser

  LogGroupName:
    Value: !Ref ParserLogGroup
