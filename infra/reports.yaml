AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The weekly meetings report, event-driven. A schedule (EventBridge Scheduler)
  puts a command on an SQS queue; the report builder (the backend image, in the
  VPC) queries Aurora and writes reports/<week>.csv to S3 through a free
  gateway endpoint; the file appearing in S3 is an event that starts the
  mailer (outside the VPC), which emails it through SES. Neither function calls
  the other. Deployed by scripts/deploy-reports.sh, which reads the network,
  image and database settings off the deployed backend function.

Parameters:
  ProjectName:
    Type: String
    Default: peach

  ImageUri:
    Type: String
    Description: The backend's container image; the builder runs it with another command.

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The backend function's subnets.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The backend function's security group. The database already admits it on
      5432, so the builder reaches Aurora without a new rule.

  RouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables of those subnets; the S3 gateway endpoint is added to them.

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: The backend's DATABASE_URL, copied off the function by the deploy script.

  SenderEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: >-
      The From address. With no domain of your own, an email address you can
      read: SES sends a verification link to it when the stack is created.

  RecipientEmail:
    Type: String
    Default: ""
    Description: >-
      Where the report goes. Empty = the sender. In the SES sandbox a recipient
      must be verified too; a different address gets its own verification email.

  ScheduleExpression:
    Type: String
    Default: "cron(0 7 ? * MON *)"
    Description: Every Monday at 07:00. rate(5 minutes) for one test run, then back.

  ScheduleTimezone:
    Type: String
    Default: Europe/Kyiv
    Description: Without it the cron runs in UTC and the hour moves with daylight saving.

  BuilderTimeout:
    Type: Number
    Default: 60
    MinValue: 30
    MaxValue: 900
    Description: Seconds. Aurora may need about 15 seconds to resume from a pause.

  QueueVisibilityTimeout:
    Type: Number
    Default: 360
    MinValue: 0
    MaxValue: 43200
    Description: >-
      Seconds; at least 6 x BuilderTimeout. Shorter, and a message becomes
      visible again while the first attempt still runs: two builders, one report.

  FailWeek:
    Type: String
    Default: ""
    Description: >-
      Lab step 7 only: the builder raises for this week (e.g. 2026-W30), so you
      can watch the message reach the dead-letter queue. Empty normally.

  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  HasSeparateRecipient: !And
    - !Not [!Equals [!Ref RecipientEmail, ""]]
    - !Not [!Equals [!Ref RecipientEmail, !Ref SenderEmail]]

Resources:
  # --- storage ------------------------------------------------------------

  # The bucket is named by hand, not left to CloudFormation: the mailer's
  # invoke permission needs the bucket's ARN, and the bucket's notification
  # needs that permission to exist first. With !GetAtt ReportsBucket.Arn the
  # two would depend on each other; with a constructed name they do not.
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt Mailer.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Without it the builder's PutObject has nowhere to go - no NAT, no internet
  # route - and hangs until the function times out. Gateway endpoints are free.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: !Ref RouteTableIds

  # --- the queue ----------------------------------------------------------

  RequestsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days, the maximum
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  RequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: !Ref QueueVisibilityTimeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RequestsDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- builder: in the VPC, next to the database ---------------------------

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        # Receive and delete from the queue: the Lambda service polls it for us.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: write-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Builder:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Builds reports/<week>.csv from Aurora
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      # Same image as the API, another entry point: the models, the database
      # code and build_weekly_report come along for free.
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: !Ref BuilderTimeout
      Role: !GetAtt BuilderRole.Arn
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      Environment:
        Variables:
          APP_ENV: production
          DB_POOLING: "false"
          DATABASE_URL: !Ref DatabaseUrl
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          FAIL_WEEK: !Ref FailWeek
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # One message per invocation: a failed report retries alone. The function in
  # a VPC with no NAT still gets these - the Lambda service polls the queue.
  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RequestsQueue.Arn
      FunctionName: !Ref Builder
      BatchSize: 1
      Enabled: true

  # --- the schedule: a command on the queue every Monday -------------------

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: send-report-request
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: BuildWeeklyReport for the previous ISO week
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt RequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # week: null - the builder picks the previous ISO week.
        Input: '{"week": null, "source": "schedule"}'

  # --- mailer: outside the VPC, reacts to the file -------------------------

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Read reports, send email - and nothing that writes to reports/: a
        # function triggered by uploads there that uploads there calls itself
        # forever.
        - PolicyName: read-and-mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Mailer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Emails a new reports/*.csv through SES
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt MailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          SENDER: !Ref SenderEmail
          RECIPIENTS: !If [HasSeparateRecipient, !Ref RecipientEmail, !Ref SenderEmail]
      Code:
        ZipFile: |
          import logging, os, urllib.parse
          from email.message import EmailMessage

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")


          def handler(event, context):
              record = event["Records"][0]
              bucket = record["s3"]["bucket"]["name"]
              key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
              log.info("report-mailer triggered trigger=s3 event=%s bucket=%s key=%s",
                       record["eventName"], bucket, key)

              body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
              week = key.rsplit("/", 1)[-1].removesuffix(".csv")
              to = [a.strip() for a in os.environ["RECIPIENTS"].split(",") if a.strip()]
              summary = "\n".join(body.decode("utf-8").split("\n\n")[0].splitlines()[1:])

              msg = EmailMessage()
              msg["Subject"] = f"{os.environ['PROJECT_NAME']}: weekly meetings report {week}"
              msg["From"] = os.environ["SENDER"]
              msg["To"] = ", ".join(to)
              msg.set_content(f"The meetings report for {week} is attached.\n\n{summary}\n")
              msg.add_attachment(body, maintype="text", subtype="csv",
                                 filename=f"{week}.csv")

              sent = ses.send_email(
                  FromEmailAddress=os.environ["SENDER"],
                  Destination={"ToAddresses": to},
                  Content={"Raw": {"Data": msg.as_bytes()}},
              )
              log.info("report-mailer sent key=%s to=%s message_id=%s",
                       key, ",".join(to), sent["MessageId"])
              return {"status": "sent", "key": key}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Mailer
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # --- SES ----------------------------------------------------------------

  # No domain of our own, so an email-address identity: SES mails a link to
  # it, and it is Verified once the link is clicked. The sandbox only sends to
  # verified addresses, 200 a day - enough for a weekly report.
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail

  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSeparateRecipient
    Properties:
      EmailIdentity: !Ref RecipientEmail

Outputs:
  BucketName:
    Value: !Ref ReportsBucket

  QueueUrl:
    Value: !Ref RequestsQueue

  DeadLetterQueueUrl:
    Value: !Ref RequestsDeadLetterQueue

  BuilderName:
    Value: !Ref Builder

  MailerName:
    Value: !Ref Mailer

  BuilderLogGroup:
    Value: !Ref BuilderLogGroup

  MailerLogGroup:
    Value: !Ref MailerLogGroup
